[package]
name = "dictation-tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dictation-tool"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
whisper-rs = { version = "0.16.0", features = ["hipblas"] }
evdev = "0.13.2"
cpal = "0.18.2"
zbus = "5.19.0"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
crossbeam-channel = "0.5"
chrono = "0.4"

[profile.release]
debug = false
